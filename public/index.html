<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      background: #101a28;
      color: #ecf4ff;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 44px 22px;
    }
    p { line-height: 1.7; color: #bfd0e5; }
    .notice {
      padding: 18px;
      border: 1px solid #51667c;
      border-radius: 14px;
      margin: 24px 0;
    }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; }
    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #51667c;
    }
    button { cursor: pointer; }
    button:disabled { cursor: wait; }
    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }
    li {
      padding: 18px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #1a2a3d;
    }
    strong { display: block; margin-bottom: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>자료실</h1>
    <p>실습을 위해 만든 가상 메모를 사용하는 자료실입니다.</p>

    <div class="notice">
      가상 메모는 DB에서 서버 API를 통해 읽습니다.
      이전 공개 Git 커밋과 배포 이력은 삭제되지 않았습니다.
    </div>

    <p id="status" role="status">로그인 상태를 확인하는 중입니다.</p>

    <form id="login-form" hidden>
      <label>
        이메일
        <input id="email" type="email"
               autocomplete="username" required>
      </label>
      <label>
        비밀번호
        <input id="password" type="password"
               autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">로그인</button>
    </form>

    <button id="logout-button" type="button" hidden>
      로그아웃
    </button>

    <p id="message" role="alert"></p>
    <ul id="notes" aria-live="polite" hidden></ul>
  </main>

  <script type="module">
    const status = document.querySelector('#status');
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const message = document.querySelector('#message');
    const list = document.querySelector('#notes');
    let viewVersion = 0;

    function showListMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    try {
      const { createClient } = await import(
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm'
      );

      const supabase = createClient(
        'https://tajrdnlxsegeburwodnl.supabase.co',
        'sb_publishable_KCBRXcZaX0rKlgxb6wVvZg_ad5fzavC'
      );

      async function updateScreen(session) {
        const version = ++viewVersion;
        const loggedIn = Boolean(session);

        form.hidden = loggedIn;
        logoutButton.hidden = !loggedIn;
        list.hidden = !loggedIn;
        list.replaceChildren();

        if (!loggedIn) {
          status.textContent = 'ログ인하지 않았습니다. 로그인해 주세요.'
            .replace('ログ', '로그');
          return;
        }

        status.textContent =
          `${session.user.email || '사용자'} 계정으로 로그인했습니다.`;
        showListMessage('메모를 불러오는 중입니다.');

        try {
          const response = await fetch('/api/notes', {
            cache: 'no-store',
            headers: {
              Authorization: `Bearer ${session.access_token}`
            }
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || '메모를 읽을 수 없습니다.');
          }
          if (!Array.isArray(data.notes)) {
            throw new Error('메모 응답 형식이 맞지 않습니다.');
          }
          if (version !== viewVersion) return;

          if (data.notes.length === 0) {
            showListMessage('저장된 메모가 없습니다.');
            return;
          }

          list.replaceChildren(...data.notes.map(note => {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            const content = document.createElement('span');
            title.textContent = note.title;
            content.textContent = note.body ?? note.content;
            item.append(title, content);
            return item;
          }));
        } catch (error) {
          if (version === viewVersion) {
            showListMessage(error.message);
          }
        }
      }

      supabase.auth.onAuthStateChange((_event, session) => {
        message.textContent = '';
        void updateScreen(session);
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = '';

        try {
          const { error } = await supabase.auth.signInWithPassword({
            email: document.querySelector('#email').value.trim(),
            password: document.querySelector('#password').value
          });

          if (error) throw error;
          document.querySelector('#password').value = '';
        } catch (error) {
          message.textContent = `로그인 실패: ${error.message}`;
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;

        try {
          const { error } = await supabase.auth.signOut();
          if (error) throw error;
        } catch (error) {
          message.textContent = `로그아웃 실패: ${error.message}`;
        } finally {
          logoutButton.disabled = false;
        }
      });
    } catch {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      message.textContent =
        '인터넷 연결과 공개용 키를 확인하고 새로고침해 주세요.';
    }
  </script>
</body>
</html>
