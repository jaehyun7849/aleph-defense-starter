<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      background: #101a28;
      color: #ecf4ff;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 44px 22px;
    }
    p { line-height: 1.7; color: #bfd0e5; }
    .notice {
      padding: 18px;
      border: 1px solid #51667c;
      border-radius: 14px;
      margin: 24px 0;
    }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; }
    input, textarea, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #51667c;
    }
    button { cursor: pointer; }
    button:disabled { cursor: wait; }
    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }
    li {
      padding: 18px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #1a2a3d;
    }
    strong { display: block; margin-bottom: 6px; }
    textarea { min-height: 110px; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    li span { white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>자료실</h1>
    <p>실습을 위해 만든 가상 메모를 사용하는 자료실입니다.</p>

    <div class="notice">
      가상 메모는 DB에서 서버 API를 통해 읽습니다.
      이전 공개 Git 커밋과 배포 이력은 삭제되지 않았습니다.
    </div>

    <p id="status" role="status">로그인 상태를 확인하는 중입니다.</p>

    <form id="login-form" hidden>
      <label>
        이메일
        <input id="email" type="email"
               autocomplete="username" required>
      </label>
      <label>
        비밀번호
        <input id="password" type="password"
               autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">로그인</button>
    </form>

    <button id="logout-button" type="button" hidden>
      로그아웃
    </button>

    <form id="note-form" hidden>
      <h2 id="editor-title">내 메모 추가</h2>
      <label>제목
        <input id="note-title" maxlength="200" required>
      </label>
      <label>본문
        <textarea id="note-body" maxlength="10000"></textarea>
      </label>
      <div class="actions">
        <button id="save-button" type="submit">추가</button>
        <button id="cancel-button" type="button" hidden>수정 취소</button>
      </div>
    </form>
    <p id="message" role="alert"></p>
    <ul id="notes" aria-live="polite" hidden></ul>
  </main>

  <script type="module">
    const status = document.querySelector('#status');
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const message = document.querySelector('#message');
    const list = document.querySelector('#notes');
    const noteForm = document.querySelector('#note-form');
    const titleInput = document.querySelector('#note-title');
    const bodyInput = document.querySelector('#note-body');
    const saveButton = document.querySelector('#save-button');
    const cancelButton = document.querySelector('#cancel-button');
    const editorTitle = document.querySelector('#editor-title');
    let currentSession = null;
    let editingId = null;
    let viewVersion = 0;

    function showListMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }
    function resetEditor() {
      editingId = null;
      noteForm.reset();
      editorTitle.textContent = '내 메모 추가';
      saveButton.textContent = '추가';
      cancelButton.hidden = true;
    }

    try {
      const { createBrowserAuth } = await import('/auth-client.js');
      const supabase = { auth: createBrowserAuth() };

      async function request(path, method = 'GET', payload) {
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session) throw new Error('다시 로그인해 주세요.');
        const response = await fetch(path, {
          method,
          cache: 'no-store',
          headers: {
            Authorization: `Bearer ${data.session.access_token}`,
            ...(payload ? { 'Content-Type': 'application/json' } : {})
          },
          ...(payload ? { body: JSON.stringify(payload) } : {})
        });
        if (response.status === 204) return null;
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '요청에 실패했습니다.');
        return result;
      }

      function renderNote(note) {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        const actions = document.createElement('div');
        actions.className = 'actions';
        title.textContent = note.title;
        body.textContent = note.body;
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '수정';
        edit.addEventListener('click', async () => {
          const account = currentSession?.user.id;
          edit.disabled = true;
          try {
            const selected = await request('/api/notes/' + note.id);
            if (!account || currentSession?.user.id !== account) return;
            editingId = selected.id;
            titleInput.value = selected.title;
            bodyInput.value = selected.body;
            editorTitle.textContent = '내 메모 수정';
            saveButton.textContent = '수정 저장';
            cancelButton.hidden = false;
            titleInput.focus();
            noteForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } catch (error) { message.textContent = error.message; }
          finally { edit.disabled = false; }
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          if (!window.confirm('이 메모를 삭제할까요?')) return;
          const account = currentSession?.user.id;
          remove.disabled = true;
          try {
            await request('/api/notes/' + note.id, 'DELETE');
            if (!account || currentSession?.user.id !== account) return;
            if (editingId === note.id) resetEditor();
            message.textContent = '메모를 삭제했습니다.';
            await loadNotes();
          } catch (error) { message.textContent = error.message; }
          finally { remove.disabled = false; }
        });
        actions.append(edit, remove);
        item.append(title, body, actions);
        return item;
      }

      async function loadNotes() {
        const version = ++viewVersion;
        if (!currentSession) return;
        showListMessage('내 메모를 불러오는 중입니다.');
        try {
          const notes = await request('/api/notes');
          if (version !== viewVersion || !currentSession) return;
          if (!Array.isArray(notes)) throw new Error('목록 응답 형식이 맞지 않습니다.');
          if (!notes.length) {
            showListMessage('내 메모가 없습니다. 위에서 새 메모를 추가하세요.');
          } else {
            list.replaceChildren(...notes.map(renderNote));
          }
        } catch (error) {
          if (version === viewVersion && currentSession) showListMessage(error.message);
        }
      }

      supabase.auth.onAuthStateChange((_event, session) => {
        const accountChanged = currentSession?.user.id !== session?.user.id;
        currentSession = session;
        ++viewVersion;
        const loggedIn = Boolean(session);
        form.hidden = loggedIn;
        logoutButton.hidden = !loggedIn;
        list.hidden = !loggedIn;
        noteForm.hidden = !loggedIn;
        status.textContent = loggedIn
          ? `${session.user.email || '사용자'} 계정으로 로그인했습니다.`
          : '로그인하지 않았습니다. 로그인해 주세요.';
        if (accountChanged || !loggedIn) {
          message.textContent = '';
          resetEditor();
          list.replaceChildren();
        }
        // SDK 이벤트 처리가 끝난 뒤 세션과 메모를 읽습니다.
        if (loggedIn) setTimeout(() => { void loadNotes(); }, 0);
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = '';
        try {
          const { error } = await supabase.auth.signInWithPassword({
            email: document.querySelector('#email').value.trim(),
            password: document.querySelector('#password').value
          });
          if (error) throw error;
          document.querySelector('#password').value = '';
        } catch (error) { message.textContent = '로그인 실패: ' + error.message; }
        finally { loginButton.disabled = false; }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const { error } = await supabase.auth.signOut();
          if (error) throw error;
        } catch (error) { message.textContent = '로그아웃 실패: ' + error.message; }
        finally { logoutButton.disabled = false; }
      });

      cancelButton.addEventListener('click', resetEditor);
      noteForm.addEventListener('submit', async event => {
        event.preventDefault();
        const id = editingId;
        const account = currentSession?.user.id;
        saveButton.disabled = true;
        message.textContent = '';
        try {
          const payload = { title: titleInput.value, body: bodyInput.value };
          if (id) await request('/api/notes/' + id, 'PUT', payload);
          else await request('/api/notes', 'POST', payload);
          if (!account || currentSession?.user.id !== account) return;
          resetEditor();
          message.textContent = id ? '메모를 수정했습니다.' : '메모를 추가했습니다.';
          await loadNotes();
        } catch (error) { message.textContent = error.message; }
        finally { saveButton.disabled = false; }
      });
    } catch {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      message.textContent = '인터넷 연결과 서버 로그인 설정을 확인하고 새로고침해 주세요.';
    }
  </script>
</body>
</html>
